<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Sport Store </title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="mono">Sport Store</span>
  <button class="cart-btn" id="cartToggle" aria-label="Abrir carrito">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="21" r="1.4" fill="currentColor" stroke="none"/></svg>
    <span>Carrito</span>
    <span class="cart-count mono" id="cartCount">0</span>
  </button>
</header>

<section class="products" id="productos">
  <div class="grid" id="productGrid"></div>
</section>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Carrito de compras">
  <div class="drawer-head">
    <h2>Tu carrito</h2>
    <button class="close-btn" id="closeCart" aria-label="Cerrar carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<script src="script.js"></script>
</body>
</html>
