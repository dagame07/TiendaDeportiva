<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Inicia el Nav -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="logo-wrapper">
                   
                    <img src="/Pictures/Sports store.png" alt="Logo" class="custom-logo">
                    <span class="ms-2">Sports <span class="text-red">Store</span></span>
                </div>
            </a>

            <!-- Botón Móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#">Destacados</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Hombres</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Mujeres</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Niños</a></li>
                </ul>


                <div class="d-flex align-items-center">
                    <form class="search-container me-3" role="search">
                        <span class="search-icon">🔍</span>
                        <input class="form-control" type="search" placeholder="Buscar...">
                    </form>
                    <div class="cart-icon">
                          <button class="cart-btn" id="cartToggle" aria-label="Abrir carrito">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="21" r="1.4" fill="currentColor" stroke="none"/></svg>
                            <span>Carrito</span>
                            <span class="cart-count mono" id="cartCount">0</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <!-- Termina el Nav -->

   
    <main class="flex-grow-1">
        <!--******primer carrusel***********************************************-->
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
            <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"
            ></button>
            <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="1"
                aria-label="Slide 2"
            ></button>
            <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="2"
                aria-label="Slide 3"
            ></button>
            </div>
            <div class="carousel-inner">
            <div class="carousel-item active">
                <img
                src="../Pictures/Nujer_bateando.png"
                class="d-block w-100"
                alt="../"
                />
            </div>
            <div class="carousel-item">
                <img
                src="../Pictures/Hombre_corriendo.png"
                class="d-block w-100"
                alt="..."
                />
            </div>
            <div class="carousel-item">
                <img
                src="../Pictures/TenisNegroYDorado.png"
                class="d-block w-100"
                alt="..."
                />
            </div>
            </div>
            <div class="container">
            <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev"
            >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
            </button>
            <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next"
            >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
            </button>
            </div>
        </div>
    
    </div>
    </main>
    
     <!--Carrito-->
    <section class="products" id="productos">
            <div class="grid" id="productGrid"></div>
            </section>

            <div class="overlay" id="overlay"></div>
            <aside class="drawer" id="drawer" aria-label="Carrito de compras">
            <div class="drawer-head">
                <h2>Tu carrito</h2>
                <button class="close-btn" id="closeCart" aria-label="Cerrar carrito">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="drawer-items" id="drawerItems"></div>
            <div class="drawer-foot" id="drawerFoot"></div>
    </aside>
    <!--Fin de Carrito-->



     <!--Pie de página-->
    <footer class="footer text-center mt-3">
        <div class="container">
            <p>Copyright &copy; 2026. All rights reserved. <span class="text-danger"></span>MADE BY: Team 6</p>
        </div>

    </footer>
    <!--Fin de página-->


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
