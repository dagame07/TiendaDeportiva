<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Inicia el Nav -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="logo-wrapper">
                    <div class="brand-tooltip">Carl Vell</div>
                    <img src="/Pictures/Sports store.png" alt="Logo" class="custom-logo">
                    <span class="ms-2">Sports <span class="text-red">Store</span></span>
                </div>
            </a>

            <!-- Botón Móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#">Destacados</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Hombres</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Mujeres</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Niños</a></li>
                </ul>


                <div class="d-flex align-items-center">
                    <form class="search-container me-3" role="search">
                        <span class="search-icon">🔍</span>
                        <input class="form-control" type="search" placeholder="Buscar...">
                    </form>
                    <div class="cart-icon">🛒</div>
                </div>
            </div>
        </div>
    </nav>
    <!-- Termina el Nav -->

    <main class="flex-grow-1">
        <!--******primer carrusel***********************************************-->
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
            <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"
            ></button>
            <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="1"
                aria-label="Slide 2"
            ></button>
            <button
                type="button"
                data-bs-target="#carouselExampleIndicators"
                data-bs-slide-to="2"
                aria-label="Slide 3"
            ></button>
            </div>
            <div class="carousel-inner">
            <div class="carousel-item active">
                <img
                src="../Pictures/Nujer_bateando.png"
                class="d-block w-100"
                alt="../"
                />
            </div>
            <div class="carousel-item">
                <img
                src="../Pictures/Hombre_corriendo.png"
                class="d-block w-100"
                alt="..."
                />
            </div>
            <div class="carousel-item">
                <img
                src="../Pictures/TenisNegroYDorado.png"
                class="d-block w-100"
                alt="..."
                />
            </div>
            </div>
            <div class="container">
            <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev"
            >
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
            </button>
            <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next"
            >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
            </button>
            </div>
        </div>
    
    </div>
    </main>
    



     <!--Pie de página-->
    <footer class="footer text-center mt-3">
        <div class="container">
            <p>Copyright &copy; 2026. All rights reserved. <span class="text-danger"></span>MADE BY: Team 6</p>
        </div>

    </footer>
    <!--Fin de página-->


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
